name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Use the installed package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/prefix"
          gcc -std=gnu11 examples/ping_pong.c $(PKG_CONFIG_PATH="$RUNNER_TEMP/prefix/lib/pkgconfig" pkg-config --cflags --libs clpf) -o ping_pong
          ./ping_pong

  sanitizers:
    name: Tests (${{ matrix.sanitizer }} sanitizer)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCLPF_SANITIZE=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build -j
      # Recent kernels randomise mmap more than the sanitizers' shadow memory allows
      - name: Test
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          setarch -R ctest --test-dir build --output-on-failure --timeout 200

  lint:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned tools
        run: pip install clang-format==23.1.3 clang-tidy==23.1.4
      - name: Check formatting
        run: git ls-files 'src/*.[ch]' 'include/*.h' 'tests/*.[ch]' 'examples/*.c' 'bench/*.c' 'auto_reduce/*.c' main.c | xargs clang-format --dry-run --Werror
      - name: Static analysis
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          git ls-files 'src/*.c' 'tests/*.c' 'examples/*.c' 'bench/*.c' 'auto_reduce/*.c' main.c | xargs -P "$(nproc)" -n 4 clang-tidy -p build --quiet
